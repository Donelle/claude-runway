name: Tests

# Runs the existing unit test suite (tests/test_*.py) and mypy on every PR
# and on pushes to main. See issue #51.
#
# The issue's proposal also included a lint step for template/placeholder
# consistency and EVALUATION.md tool-count drift, gated on "once GROW-01's
# setup script and GROW-05's self-updating tool-count utility exist" --
# those were issues #48 and #52. Both have since landed, so the tool-count
# half of that lint step is now included below ("Check MCP tool counts").
# It's a smoke check, not a doc-vs-code comparison: EVALUATION.md no
# longer hardcodes a tool count to compare against (issue #52 replaced
# that prose with instructions to run this exact script), so there's
# nothing left to drift out of sync -- this step instead just fails loudly
# if either server's tool registry stops importing/enumerating cleanly.
# The broader template/placeholder-consistency half of the original
# proposal is still a separate, unfiled follow-up.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege default for the whole workflow: this job only checks out
# code, installs public PyPI packages, and runs mypy/unittest -- it never
# needs to write anything back to the repo (no pushes, no PR comments, no
# releases), so GITHUB_TOKEN gets read-only access instead of inheriting
# whatever broader default the repo/org has configured.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA (not the mutable v4 tag) so this job always
      # runs the exact, audited action code -- a floating tag could move to
      # unreviewed code after this file was last reviewed. v4.4.0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Same reasoning, pinned to v5.6.0.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          # 3.12+ is the documented policy minimum for the Qdrant piece
          # (ingest_mcp_server.py/ingest_to_qdrant.py); the local-compress
          # piece only requires 3.11+. 3.12 satisfies both.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --index-url https://pypi.org/simple
          pip install -r requirements-dev.txt --index-url https://pypi.org/simple

      - name: Type check (mypy)
        run: mypy libs tools hooks

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check MCP tool counts (issue #52/GROW-05)
        run: python tools/report_tool_counts.py

  # Issue #206 acceptance criterion: on each of Windows/macOS/Linux, a
  # `uv tool install`/pipx-style install (built wheel installed into a
  # FRESH environment, not this checkout's own venv) must put
  # libs/tools/hooks/templates/skills under <env>/src/, all 3 console
  # scripts must run, and `claude-runway-setup init --dry-run` must
  # generate config whose script/hook paths exist on disk. A separate job
  # (not a step in `test` above) because it needs the OS matrix below --
  # `test` stays ubuntu-only since mypy/unittest have no OS-specific
  # behavior to catch. Replaces the single ubuntu-only
  # "Build & smoke-test pip packaging" step this job used to be inline in
  # `test` (issue #50) -- same checks, now run on all 3 platforms instead
  # of just one; tests/test_pyproject.py's BuiltWheelHasExpectedDataLayout
  # covers the wheel-CONTENTS half of this same acceptance criterion
  # without needing 3 OS runners, since a wheel's own DATA-category
  # install-to-sys.prefix behavior is a wheel-spec guarantee, not
  # OS-specific -- this job instead covers the parts that genuinely are
  # OS-specific: real path separators, real venv layout (`bin` vs
  # `Scripts`), and real console-script shims.
  packaging-smoke:
    name: Packaging smoke test (issue #206)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build wheel, install into a FRESH env, and smoke-test (issue #206)
        # `shell: bash` -- GitHub-hosted Windows runners ship Git Bash, so
        # this one script works unmodified across all three OSes instead of
        # needing a separate PowerShell/cmd variant. The two things that
        # genuinely differ per-OS (the venv's script directory name -- "bin"
        # vs "Scripts" -- and whether an executable needs a suffix) are
        # detected inline below rather than assumed. A FRESH venv (not
        # `pip install .` into the job's own Python, which is what the
        # ubuntu-only predecessor step did) is deliberate here: it's the
        # only way to confirm the payload lands under THAT environment's
        # own `<prefix>/src/`, matching what a real `pipx install`/`uv tool
        # install` does into ITS OWN managed venv.
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # `python -m build` (unlike `pip install`) has no `--index-url`
          # flag of its own -- passing one is a straight CLI parse error
          # ("unrecognized arguments: --index-url"), confirmed live
          # (Copilot review, PR #228). `--no-isolation` sidesteps the whole
          # question: it reuses THIS pip install (already pointed at public
          # PyPI via --index-url below) instead of `build` spinning up its
          # own nested, isolated pip environment that would need a SEPARATE
          # way to be told which index to use (e.g. PIP_INDEX_URL) --
          # confirmed live that installing setuptools/wheel/build here, then
          # building with --no-isolation, produces an identical wheel to a
          # fully isolated build.
          python -m pip install --index-url https://pypi.org/simple "setuptools>=68" wheel build
          python -m build --wheel --no-isolation -o dist
          python -m venv fresh-env
          if [ -f fresh-env/Scripts/python.exe ]; then
            VENV_PY=fresh-env/Scripts/python.exe
            VENV_BIN=fresh-env/Scripts
          else
            VENV_PY=fresh-env/bin/python
            VENV_BIN=fresh-env/bin
          fi
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install dist/*.whl --index-url https://pypi.org/simple

          # Acceptance criterion: the payload lands under <env>/src/, a
          # SIBLING of the venv's own bin/Scripts directory -- not back in
          # site-packages.
          "$VENV_PY" -c "import sys, os
          for name in ('libs', 'tools', 'hooks', 'templates', 'skills'):
              p = os.path.join(sys.prefix, 'src', name)
              assert os.path.isdir(p), 'missing ' + p
          print('OK: libs/tools/hooks/templates/skills all present under <env>/src/')"

          "$VENV_BIN/claude-runway-doctor" --help
          "$VENV_BIN/claude-runway-ingest" --help
          mkdir -p pkgtest-target
          "$VENV_BIN/claude-runway-setup" init "$(pwd)/pkgtest-target" --dry-run
