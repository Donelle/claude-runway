[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-runway"
version = "0.1.0"
description = "Local-compute token savings for Claude Code: Qdrant codebase memory + LM Studio local compression."
readme = "README.md"
license = { text = "MIT" }
# Policy minimums are 3.12 (Qdrant piece) / 3.11 (local-compress piece) --
# see docs/prerequisites.md -- but the dependency chain itself
# only needs 3.10, and that's the honest floor for a packaging manifest
# whose whole point is "works wherever pip/pipx/uvx can resolve it".
requires-python = ">=3.10"

# Matches requirements.txt's "Core" + local-compress sections combined --
# NOT split into an optional extra the way requirements.txt splits
# local-compress out, despite tools/doctor.py and tools/ingest_to_qdrant.py
# themselves needing none of the openai/requests/trafilatura trio (confirmed
# by grepping their own imports and their libs/ dependencies -- doctor_lib.py/
# qdrant_ingest_lib.py are stdlib-only). The reason: claude-runway-setup's
# OWN default behavior (no --qdrant-only flag) generates a .mcp.json that
# enables the local-compress MCP server (tools/compress_mcp_server.py) and
# its hooks -- pointed at THIS SAME install's interpreter, per
# tools/setup_project.py's _pip_installed_venv_python(). A plain default
# `pipx install claude-runway` + `claude-runway-setup init` (no flags) with
# these left as an opt-in extra generates a config for a server that crashes
# on startup (confirmed live: ModuleNotFoundError: trafilatura, running
# compress_mcp_server.py against a venv installed without them) -- the
# hooks fail open in that case rather than crashing outright, but silently
# do nothing useful either. Bundling them in the default install is what
# makes the default `claude-runway-setup init` output actually work out of
# the box; `--qdrant-only` remains available for anyone who genuinely only
# wants the Qdrant memory piece and would rather not pull these in, but
# pipx/uvx installs this whole package into one isolated environment
# regardless, so there's no meaningful "smaller install" to gain by leaving
# them optional the way requirements.txt's own two-file split achieves for a
# manual venv.
#
# pathspec is ALSO base here, not an extra (PR #136 review, Copilot) -- for
# a security-relevant reason, not just convenience: libs/qdrant_ingest_lib.py
# defaults respect_gitignore=True but silently falls back to "don't filter
# at all" if pathspec isn't importable (no error, no warning -- see
# load_gitignore_spec's own docstring). --qdrant-api-key writes a real
# credential into a project's .mcp.json and this repo's OWN documentation
# tells users to gitignore that file if they do -- so claude-runway-ingest
# silently NOT respecting that gitignore rule means the credential gets
# indexed into Qdrant right along with everything else, with no error to
# notice. requirements.txt's own DEFAULT install (`uv pip install -r
# requirements.txt`, i.e. everything except the explicitly-labeled "if you
# only want the Qdrant memory piece" reduced install further down in that
# same README section) already includes pathspec today -- leaving it an
# opt-in extra here would have made the new pipx/uvx default STRICTLY worse
# than the existing documented clone-based default for exactly this reason.
dependencies = [
    "mcp[cli]>=2.0.0",
    # fastmcp>=4.0.0: fastmcp<4.0.0 requires mcp<2.0.0 and uses the renamed
    # McpError class. The mcp>=2.0.0 bound above enforces this transitively
    # on fresh installs; an explicit lower bound here covers existing
    # environments that upgrade mcp without upgrading fastmcp.
    "fastmcp>=4.0.0",
    "mcp-server-qdrant",
    "qdrant-client",
    "fastembed",
    "pydantic_settings",
    "openai",
    "requests",
    "trafilatura",
    "pathspec",
]

[project.scripts]
# Issue #206: libs/tools/hooks/templates/skills are no longer
# `[tool.setuptools] packages` (see that section below) -- they ship as
# wheel DATA files instead, landing at <env>/src/{libs,tools,hooks,
# templates,skills} rather than directly in site-packages, so they no
# longer pollute the top-level import namespace with generically-named
# packages (`tools`, `libs`, `hooks`) any dependency in the same
# environment could collide with. That means `tools.ingest_to_qdrant:main`
# no longer resolves on its own -- `tools` isn't importable via a bare
# sys.path search anymore (nothing in site-packages puts <env>/src on
# sys.path automatically). `claude_runway` (see that package, and setup.py's
# data_files) is a tiny real site-packages package that exists purely to
# bridge this gap: each entry point below calls into it, it puts <env>/src
# on sys.path (located via sys.prefix, the one thing that sits at the same
# relative place on Windows/macOS/Linux), then imports and calls the real
# tools/*.py `main()` exactly as before -- behavior is unchanged, only how
# entry_points resolves it. See claude_runway/__init__.py for the shim.
claude-runway-ingest = "claude_runway:ingest_main"
claude-runway-setup = "claude_runway:setup_main"
claude-runway-doctor = "claude_runway:doctor_main"

[tool.setuptools]
# `claude_runway` is the ONE real, importable site-packages package this
# project declares (issue #206) -- see its own module docstring for why it
# exists (bridging [project.scripts] entry points to the data-files layout
# below) and [project.scripts]'s comment above for the full chain. It has
# an __init__.py deliberately (unlike libs/tools/hooks/templates/skills
# below): it genuinely is imported by dotted name (`claude_runway:
# ingest_main`), unlike any of those five, so PEP 420 implicit-namespace
# packaging doesn't apply here the way the comment below explains for them.
packages = ["claude_runway"]

# libs/, tools/, templates/, hooks/, and skills/ are NOT declared as
# setuptools packages anymore (issue #206 -- previously
# `packages = ["libs", "tools", "templates", "hooks", "skills"]` put all
# five directly in site-packages, the generic top-level-namespace layout
# this issue moves away from). setup.py's `data_files()` instead globs each
# directory and ships them as wheel DATA files under
# <env>/src/{libs,tools,hooks,templates,skills} -- installed as siblings of
# each other under a dedicated `src/` directory, exactly as they are in
# this repo today, so every script's own __file__-relative arithmetic (e.g.
# tools/setup_project.py's `run_setup(..., tools_repo_dir, ...)` deriving
# `templates_dir = tools_repo_dir / "templates"`, and each hook's `_root`/
# `_candidates` lookup) keeps resolving correctly post-install with no code
# changes -- only WHERE the sibling set lives changed (<env>/src/ instead
# of site-packages), not the sibling relationship itself. See setup.py for
# the actual glob-based file lists (a glob, not a hand-typed list, so a new
# module in any of these directories ships automatically -- see that file's
# own docstring for why skills/ specifically needs one data_files tuple PER
# skill subdirectory rather than one shared "skills" target).
#
# None of these five directories has (or needs) an __init__.py.
# libs/, hooks/, templates/, and skills/ are never imported as a Python
# package by dotted name anywhere in this repo -- each script/hook resolves
# libs/'s content via __file__ + sys.path and a bare (non-dotted) import
# (e.g. `from qdrant_ingest_lib import ...`), hooks/ is only ever invoked as
# a standalone script, and templates/skills aren't Python at all.
# `tools/` is the one exception (Copilot review, PR #228): claude_runway's
# shim DOES import it by dotted name (`from tools.ingest_to_qdrant import
# main`, etc.) once <env>/src is added to sys.path -- this works with no
# __init__.py because Python's PEP 420 implicit-namespace-package support
# lets a plain directory be imported this way. mypy (`mypy.ini`'s
# `mypy_path = libs`) is specifically why libs/ must stay import-nameless,
# though, not tools/ -- adding an __init__.py to libs/ specifically made
# mypy see libs/qdrant_retry.py under two module identities at once
# (confirmed live in this issue's own testing predecessor, issue #50/PR
# #136's own history) -- see that repo history for the "Source file found
# twice under different module names" mypy error an __init__.py there
# previously caused.

